[project]
name = "pl-match-prediction"
version = "0.1.0"
description = "Premier League match outcome predictor - scoreline probabilities from squad quality and form"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
